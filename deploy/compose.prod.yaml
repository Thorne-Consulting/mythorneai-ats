# The whole production stack in one file, for Dokploy (paste it as a Raw compose service) or
# plain `docker compose up -d`. No repository and no scripts on the host: only images.
#
# Secrets never sit in a file on the host. The host's .env (or Dokploy's environment) holds
# only the Infisical login and non-secret switches:
#
#   INFISICAL_API_URL, INFISICAL_HOSTNAME, INFISICAL_IP, INFISICAL_CLIENT_ID,
#   INFISICAL_CLIENT_SECRET, INFISICAL_PROJECT_ID, INFISICAL_ENV, IMAGE_TAG
#
# Every other setting lives in Infisical (docs/production.md lists them):
#   - The api fetches its own at start: its image has the Infisical CLI (see the Dockerfile).
#   - Postgres and RustFS have no CLI. The secrets service fetches their three keys into a
#     memory-only volume they read as files.
#
# The host must already be on the Netbird network, so Infisical is reachable.
#
# Caddy (below) is the only way in: two doors into the web app. A platform's own proxy
# (Traefik on Dokploy) sits in front of it and points at its two ports.

x-logging: &logging
  driver: json-file
  options: { max-size: '20m', max-file: '5' }

# Infisical answers only on Netbird. Public DNS can send its name to a public address, and
# containers do not see Netbird's DNS, so the containers that sign in resolve INFISICAL_HOSTNAME
# (the host in INFISICAL_API_URL) to INFISICAL_IP, Infisical's Netbird address.
x-infisical-host: &infisical-host
  - '${INFISICAL_HOSTNAME:?set INFISICAL_HOSTNAME, the host in INFISICAL_API_URL}:${INFISICAL_IP:?set INFISICAL_IP, the Netbird address of Infisical}'

x-infisical: &infisical
  INFISICAL_API_URL: ${INFISICAL_API_URL:?set INFISICAL_API_URL, e.g. https://secrets.mythorneai.com}
  INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:?set INFISICAL_CLIENT_ID}
  INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:?set INFISICAL_CLIENT_SECRET}
  INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:?set INFISICAL_PROJECT_ID}
  INFISICAL_ENV: ${INFISICAL_ENV:?set INFISICAL_ENV (staging or prod)}

services:
  # Fetches the database password and the object store keys into memory volumes, one file each,
  # then sleeps. Each of the two consumers mounts only its own volume, so the database cannot
  # read the store's keys nor the store the database's password. It must stay up: Docker drops a
  # memory volume's contents when no running container has it mounted, so if this exited, they
  # would find an empty folder. It holds no token after the fetch.
  secrets:
    image: infisical/cli:0.44.12
    extra_hosts: *infisical-host
    environment:
      <<: *infisical
      INFISICAL_DISABLE_TELEMETRY: '1'
    entrypoint: ['sh', '-c']
    command:
      - |
        set -e
        token=$$(infisical login --method=universal-auth --client-id="$$INFISICAL_CLIENT_ID" --client-secret="$$INFISICAL_CLIENT_SECRET" --plain --silent)
        unset INFISICAL_CLIENT_ID INFISICAL_CLIENT_SECRET
        # Readable inside its own volume only; the object store runs as its own user.
        umask 022
        fetch() {
          infisical secrets get "$$1" --token="$$token" --env="$$INFISICAL_ENV" --projectId="$$INFISICAL_PROJECT_ID" --plain --silent > "$$2/$$1"
          test -s "$$2/$$1" || { echo "$$1 is not set in Infisical ($$INFISICAL_ENV)"; exit 1; }
        }
        fetch POSTGRES_PASSWORD /run/ats/database
        fetch S3_ACCESS_KEY /run/ats/objects
        fetch S3_SECRET_KEY /run/ats/objects
        unset token
        echo "ok: database and object store keys fetched"
        exec sleep infinity
    volumes:
      - ats-secrets-database:/run/ats/database
      - ats-secrets-objects:/run/ats/objects
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ['CMD-SHELL', 'test -s /run/ats/database/POSTGRES_PASSWORD && test -s /run/ats/objects/S3_SECRET_KEY']
      interval: 3s
      timeout: 3s
      retries: 100
    # Until the host reaches Infisical (Netbird down, a wrong login), this fails and retries.
    restart: unless-stopped
    logging: *logging

  database:
    image: postgres:18-alpine
    depends_on:
      secrets:
        condition: service_healthy
    environment:
      POSTGRES_DB: internal_ats
      POSTGRES_USER: ats
      POSTGRES_PASSWORD_FILE: /run/ats/POSTGRES_PASSWORD
    # Not published: only the api on the compose network reaches it.
    volumes:
      - ats-database:/var/lib/postgresql
      - ats-secrets-database:/run/ats:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging

  # The object store, where uploads live (RustFS, S3-compatible). Its root keys are the API's
  # S3_ACCESS_KEY and S3_SECRET_KEY. Not published: only the api reaches it.
  objects:
    image: rustfs/rustfs:1.0.4
    depends_on:
      secrets:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY_FILE: /run/ats/S3_ACCESS_KEY
      RUSTFS_SECRET_KEY_FILE: /run/ats/S3_SECRET_KEY
      RUSTFS_CONSOLE_ENABLE: 'false'
    volumes:
      - ats-objects:/data
      - ats-secrets-objects:/run/ats:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    logging: *logging

  # The API. Only the Infisical login comes from here; the image's entrypoint fetches every
  # other setting (AUTH_MODE, POSTGRES_PASSWORD, S3_*...) into the process at start. It runs
  # its migrations and the SEED_SETS seed sets at every start.
  api:
    image: ghcr.io/thorne-consulting/mythorneai-ats-api:${IMAGE_TAG:-latest}
    pull_policy: always
    depends_on:
      database:
        condition: service_healthy
      objects:
        condition: service_healthy
    environment: *infisical
    extra_hosts: *infisical-host
    expose:
      - '8080'
    volumes:
      - ats-data-protection:/app/data-protection-keys
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    # No files on disk: uploads live in the object store. /tmp is memory, scratch for ffmpeg
    # and OCR while they run (2 GB fits the largest recording), and HOME for the Infisical CLI.
    tmpfs:
      - /tmp:size=2g
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8080/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
    logging: *logging

  # The web app. Holds no secrets; it talks to the api by name.
  web:
    image: ghcr.io/thorne-consulting/mythorneai-ats-web:${IMAGE_TAG:-latest}
    pull_policy: always
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Where the web server reaches the API for its own calls (who is signed in, the careers pages).
      API_ORIGIN: http://api:8080
    expose:
      - '3000'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /app/.next/cache:size=256m
    restart: unless-stopped
    logging: *logging

  # Two doors into the web app (the Caddyfile is below):
  #   - Public, port 80 inside the stack. On Dokploy, Traefik owns 80 and 443 on the host: point
  #     the public domain at this service, port 80, and Traefik does the certificate. Only the
  #     careers site, the candidate portal, booking and approval links and the webhooks pass;
  #     every other path is 404, and the bare address goes to /careers.
  #   - Staff, everything, port 8080 inside the stack. Two ways in, and only from the private
  #     network (Netbird's range, and this host): published on BIND_ADDRESS:APP_PORT for the
  #     host's Netbird address, and, for sign-in, which needs https, through a Traefik domain
  #     (Dokploy: the staff domain, service caddy, port 8080). Behind a proxy the client
  #     address comes from X-Forwarded-For, so the name can be public in DNS and still refuse
  #     anyone off the private network.
  caddy:
    image: caddy:2.11.7
    depends_on:
      web:
        condition: service_started
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080'
    expose:
      - '80'
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - ats-caddy-data:/data
      - ats-caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped
    logging: *logging

configs:
  caddyfile:
    content: |
      {
      	auto_https off
      	servers {
      		# Behind a proxy (Traefik), the client's address is in X-Forwarded-For.
      		trusted_proxies static private_ranges
      		trusted_proxies_strict
      	}
      }

      # The public door: only what candidates, approvers and outside services need. Approvers
      # open /approve/<token> from an email, like candidates open /book/<token>.
      :80 {
      	@root path /
      	redir @root /careers 302
      	@public {
      		path /careers /careers/* /candidate-portal /candidate-portal/* /book /book/*
      		path /approve/* /public/* /docs /docs/* /openapi/* /health
      		path /_next/* /brand/* /favicon.ico /favicon.svg /icon* /apple-icon* /robots.txt /sitemap.xml
      	}
      	handle @public {
      		reverse_proxy web:3000
      	}
      	handle {
      		respond 404
      	}
      }

      # The staff door: everything, for the private network only. Passes WebSocket upgrades, so
      # the inbox hub works. 100.64.0.0/10 is Netbird's default range; change it here if yours
      # differs.
      :8080 {
      	@private client_ip 100.64.0.0/10 127.0.0.0/8
      	handle @private {
      		reverse_proxy web:3000
      	}
      	handle {
      		respond "The staff app is only reachable on the private network." 403
      	}
      }

volumes:
  ats-database:
  ats-objects:
  ats-data-protection:
  ats-caddy-data:
  ats-caddy-config:
  # The database password and the object store keys, one memory volume each: memory only, gone
  # when the stack stops.
  ats-secrets-database:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,mode=0755
  ats-secrets-objects:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,mode=0755
