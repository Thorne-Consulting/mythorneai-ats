services:
  api:
    build:
      context: .
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__AtsDatabase: Host=database;Port=5432;Database=${POSTGRES_DB:-internal_ats};Username=${POSTGRES_USER:-ats};Password=${POSTGRES_PASSWORD:-ats-local-only}
      Auth__Mode: ${AUTH_MODE:-Development}
      Auth__Authority: ${AUTH_AUTHORITY:-}
      Auth__ClientId: ${AUTH_CLIENT_ID:-}
      Auth__ClientSecret: ${AUTH_CLIENT_SECRET:-}
      Auth__AllowedEmailDomains: ${AUTH_ALLOWED_EMAIL_DOMAINS:-}
      Bootstrap__AdminEmail: ${BOOTSTRAP_ADMIN_EMAIL:-}
      Bootstrap__AdminName: ${BOOTSTRAP_ADMIN_NAME:-ATS administrator}
      Integrations__Provider: ${INTEGRATIONS_PROVIDER:-None}
      Integrations__Microsoft365__TenantId: ${MICROSOFT365_TENANT_ID:-}
      Integrations__Microsoft365__ClientId: ${MICROSOFT365_CLIENT_ID:-}
      Integrations__Microsoft365__ClientSecret: ${MICROSOFT365_CLIENT_SECRET:-}
      Integrations__Microsoft365__SenderUserId: ${MICROSOFT365_SENDER_USER_ID:-}
      Integrations__Microsoft365__CreateOnlineMeetings: ${MICROSOFT365_CREATE_ONLINE_MEETINGS:-true}
      Integrations__CalendarOAuth__GoogleClientId: ${CALENDAR_OAUTH_GOOGLE_CLIENT_ID:-}
      Integrations__CalendarOAuth__GoogleClientSecret: ${CALENDAR_OAUTH_GOOGLE_CLIENT_SECRET:-}
      Integrations__CalendarOAuth__MicrosoftClientId: ${CALENDAR_OAUTH_MICROSOFT_CLIENT_ID:-}
      Integrations__CalendarOAuth__MicrosoftClientSecret: ${CALENDAR_OAUTH_MICROSOFT_CLIENT_SECRET:-}
      Integrations__CalendarOAuth__MicrosoftTenantId: ${CALENDAR_OAUTH_MICROSOFT_TENANT_ID:-common}
      Integrations__CalendarOAuth__RedirectUri: ${CALENDAR_OAUTH_REDIRECT_URI:-}
      Integrations__GoogleWorkspace__ImpersonatedUser: ${GOOGLE_WORKSPACE_IMPERSONATED_USER:-}
      Integrations__GoogleWorkspace__CalendarId: ${GOOGLE_WORKSPACE_CALENDAR_ID:-primary}
      Integrations__GoogleWorkspace__ServiceAccountJsonPath: ${GOOGLE_WORKSPACE_SERVICE_ACCOUNT_JSON_PATH:-}
      Integrations__GoogleWorkspace__ServiceAccountJsonBase64: ${GOOGLE_WORKSPACE_SERVICE_ACCOUNT_JSON_BASE64:-}
      Integrations__GoogleWorkspace__CreateOnlineMeetings: ${GOOGLE_WORKSPACE_CREATE_ONLINE_MEETINGS:-true}
      Resend__ApiKey: ${RESEND_API_KEY:-}
      Resend__From: ${RESEND_FROM:-}
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      OpenAI__Model: ${OPENAI_MODEL:-gpt-4o-mini}
      DataProtection__KeyPath: /app/data-protection-keys
      FileStorage__RootPath: /app/uploads
    expose:
      - "8080"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ats-data-protection:/app/data-protection-keys
      - ats-uploads:/app/uploads
    restart: unless-stopped

  web:
    build:
      context: ./src/web
      args:
        API_ORIGIN: http://api:8080
    ports:
      - "${APP_PORT:-8080}:3000"
    depends_on:
      - api
    restart: unless-stopped

  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-internal_ats}
      POSTGRES_USER: ${POSTGRES_USER:-ats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ats-local-only}
    volumes:
      - ats-database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  ats-database:
  ats-data-protection:
  ats-uploads:
