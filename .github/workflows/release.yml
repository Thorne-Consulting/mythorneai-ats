# Builds the two images and publishes them to GHCR when staging or main moves. Nothing else:
# the host pulls them (Dokploy, or `docker compose up -d` with deploy/compose.prod.yaml).
# The tests already ran on the pull request, so this does not run them again.
#
#   staging -> ghcr.io/<owner>/mythorneai-ats-{api,web}:staging
#   main    -> ...:latest and :main
#   v1.2.3  -> ...:1.2.3 and :1.2
#
# Every build also gets sha-<commit>, a tag that never moves; set IMAGE_TAG to it to pin one.
name: release

on:
  push:
    branches: [staging, main]
    tags: ['v*']
  workflow_dispatch:

# One release at a time per branch; a newer push waits for the one in progress.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Nothing by default; each job asks for what it needs.
permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  images:
    name: image (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A manual run only publishes from the two protected branches; a v* tag needs an admin
    # (the tags ruleset), so nothing unreviewed gets a version or a branch tag.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: api, context: ., file: Dockerfile }
          - { name: web, context: ./src/web, file: src/web/Dockerfile }
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_BASE }}-${{ matrix.image.name }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=long
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max
          # Provenance and a software bill of materials travel with the image.
          provenance: mode=max
          sbom: true
